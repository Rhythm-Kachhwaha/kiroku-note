name: CI Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest httpx

      - name: Audit git tracking for extension/lib
        shell: bash
        run: |
          echo "Checking tracked extension/lib files:"
          tracked_files=$(git ls-files extension/lib)
          echo "$tracked_files"
          if [ -z "$tracked_files" ]; then
            echo "ERROR: No files tracked under extension/lib! Check .gitignore."
            exit 1
          fi
          if ! echo "$tracked_files" | grep -q "wanakana.js"; then
            echo "ERROR: wanakana.js is not tracked under extension/lib!"
            exit 1
          fi

      - name: Run Backend Tests
        shell: bash
        run: |
          python -m pytest -o pythonpath=backend backend/tests

      - name: Run Extension Tests
        shell: bash
        run: |
          node --test extension/tests/*.test.js
