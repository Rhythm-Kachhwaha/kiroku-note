<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiroku Note - Starting...</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      user-select: none;
      -webkit-app-region: drag;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
      max-width: 440px;
      z-index: 2;
      transform: translateY(-38px);
    }

    .brand-title {
      font-size: 2.45rem;
      letter-spacing: 0.03em;
      color: #121110;
      display: flex;
      align-items: baseline;
      justify-content: center;
      flex-wrap: nowrap;
      margin-bottom: 1.25rem;
    }

    .brand-title .word-kiroku {
      font-family: 'Ranchers', cursive, sans-serif;
      display: inline-flex;
      color: #E2DAC2;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .brand-title .word-space {
      width: 0.5ch;
      display: inline-block;
    }

    .brand-title .word-note {
      font-family: 'Mochiy Pop P One', 'Zen Kaku Gothic New', sans-serif;
      font-weight: 400;
      display: inline-flex;
      color: #e06852;
      font-size: 2.05rem;
      letter-spacing: 0.05em;
    }

    .letter {
      display: inline-block;
      animation: letterUplift 1.6s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      animation-delay: var(--delay, 0s);
      will-change: transform;
    }

    @keyframes letterUplift {
      0%, 100% {
        transform: translateY(0);
      }
      22% {
        transform: translateY(-9px);
      }
      44% {
        transform: translateY(0);
      }
    }

    .splash-brewing {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      margin-top: 0.35rem;
    }

    .brewing-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: #F5F1E8;
      opacity: 0.85;
      animation: brewingBreathe 2.4s ease-in-out infinite;
      display: inline-flex;
      align-items: baseline;
    }

    .brewing-dots {
      display: inline-flex;
      letter-spacing: 0.08em;
      margin-left: 1px;
    }

    .brewing-dot {
      display: inline-block;
      animation: brewingDotPulse 1.4s ease-in-out infinite both;
    }

    .brewing-dot:nth-child(1) {
      animation-delay: 0s;
    }

    .brewing-dot:nth-child(2) {
      animation-delay: 0.22s;
    }

    .brewing-dot:nth-child(3) {
      animation-delay: 0.44s;
    }

    @keyframes brewingBreathe {
      0%, 100% {
        opacity: 0.55;
        transform: translateY(0);
      }
      50% {
        opacity: 0.95;
        transform: translateY(-1px);
      }
    }

    @keyframes brewingDotPulse {
      0%, 20% {
        opacity: 0.15;
        transform: translateY(0);
      }
      50% {
        opacity: 1;
        transform: translateY(-2px);
      }
      80%, 100% {
        opacity: 0.15;
        transform: translateY(0);
      }
    }

  </style>
  <style>
    @font-face {
      font-family: 'Ranchers';
      src: url('./ui/assets/fonts/ranchers-latin-400-normal.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Mochiy Pop P One';
      src: url('./ui/assets/fonts/mochiy-pop-one-japanese-400-normal.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="brand-title" aria-label="KIROKU ノート">
      <span class="word-kiroku">
        <span class="letter" style="--delay: 0.00s;">K</span>
        <span class="letter" style="--delay: 0.08s;">I</span>
        <span class="letter" style="--delay: 0.16s;">R</span>
        <span class="letter" style="--delay: 0.24s;">O</span>
        <span class="letter" style="--delay: 0.32s;">K</span>
        <span class="letter" style="--delay: 0.40s;">U</span>
      </span>
      <span class="word-space">&nbsp;</span>
      <span class="word-note">
        <span class="letter" style="--delay: 0.48s;">ノ</span>
        <span class="letter" style="--delay: 0.56s;">ー</span>
        <span class="letter" style="--delay: 0.64s;">ト</span>
      </span>
    </div>

    <div class="splash-brewing" role="status">
      <span class="brewing-text" id="status-msg">
        Brewing<span class="brewing-dots" aria-hidden="true"><span class="brewing-dot">.</span><span class="brewing-dot">.</span><span class="brewing-dot">.</span></span>
      </span>
    </div>
  </div>
</body>
</html>
