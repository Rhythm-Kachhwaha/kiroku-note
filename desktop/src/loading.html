<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiroku Note - Starting...</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      user-select: none;
      -webkit-app-region: drag;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
      max-width: 440px;
      z-index: 2;
      transform: translateY(-38px);
    }

    .brand-title {
      font-size: 2.45rem;
      letter-spacing: 0.03em;
      color: #121110;
      display: flex;
      align-items: baseline;
      justify-content: center;
      flex-wrap: nowrap;
      margin-bottom: 1.25rem;
    }

    .brand-title .word-kiroku {
      font-family: 'Ranchers', cursive, sans-serif;
      display: inline-flex;
      color: #E2DAC2;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .brand-title .word-space {
      width: 0.5ch;
      display: inline-block;
    }

    .brand-title .word-note {
      font-family: 'Mochiy Pop P One', 'Zen Kaku Gothic New', sans-serif;
      font-weight: 400;
      display: inline-flex;
      color: #e06852;
      font-size: 2.05rem;
      letter-spacing: 0.05em;
    }

    .letter {
      display: inline-block;
      animation: letterUplift 1.6s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      animation-delay: var(--delay, 0s);
      will-change: transform;
    }

    @keyframes letterUplift {
      0%, 100% {
        transform: translateY(0);
      }
      22% {
        transform: translateY(-9px);
      }
      44% {
        transform: translateY(0);
      }
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.4rem 1.05rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
    }

    .status-text {
      font-family: 'Quicksand', 'M PLUS Rounded 1c', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.72);
      letter-spacing: 0.02em;
      line-height: 1.4;
      max-width: 340px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
  <style>
    @font-face {
      font-family: 'Ranchers';
      src: url('./ui/assets/fonts/ranchers-latin-400-normal.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Mochiy Pop P One';
      src: url('./ui/assets/fonts/mochiy-pop-one-japanese-400-normal.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="brand-title" aria-label="KIROKU ノート">
      <span class="word-kiroku">
        <span class="letter" style="--delay: 0.00s;">K</span>
        <span class="letter" style="--delay: 0.08s;">I</span>
        <span class="letter" style="--delay: 0.16s;">R</span>
        <span class="letter" style="--delay: 0.24s;">O</span>
        <span class="letter" style="--delay: 0.32s;">K</span>
        <span class="letter" style="--delay: 0.40s;">U</span>
      </span>
      <span class="word-space">&nbsp;</span>
      <span class="word-note">
        <span class="letter" style="--delay: 0.48s;">ノ</span>
        <span class="letter" style="--delay: 0.56s;">ー</span>
        <span class="letter" style="--delay: 0.64s;">ト</span>
      </span>
    </div>

    <div class="status-badge">
      <p class="status-text" id="status-msg">Waking up ...</p>
    </div>
  </div>

  <script>
    // Random message rotation
    (function setupRandomStatus() {
      const messages = [
        "Waking up ...",
        "Brewing some espresso...",
        "Sharpening the digital pencils...",
        "Dusting off your flashcards...",
        "Stretching and getting ready...",
        "Tuning the dictionary bells..."
      ];
      const randomMsg = messages[Math.floor(Math.random() * messages.length)];
      const el = document.getElementById("status-msg");
      if (el) {
        el.textContent = randomMsg;
      }
    })();
  </script>
</body>
</html>
