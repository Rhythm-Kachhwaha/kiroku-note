<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' http://127.0.0.1:*; font-src 'self';">
  <title>Kiroku Note</title>

  <!-- Early Preload for Rive WebAssembly Runtime -->
  <link rel="preload" href="./ui/vendor/rive.wasm" as="fetch" type="application/wasm" crossorigin>

  <!-- Local Offline CSS Bundles (Zero Runtime CDNs) -->
  <link rel="stylesheet" href="./ui/styles/tokens.css">
  <link rel="stylesheet" href="./ui/styles/fonts.css">
  <link rel="stylesheet" href="./ui/styles/tactile.css">
  <link rel="stylesheet" href="./ui/shell/shell.css">
  <link rel="stylesheet" href="./ui/styles/bundle.css">
</head>

<body>
  <!-- Integrated Fast Boot Splash Overlay (Allows background app to pre-render completely) -->
  <div id="app-loading-splash" class="app-loading-splash">
    <div class="splash-container">
      <div class="brand-title" aria-label="Kiroku Note">
        <span class="word-kiroku">
          <span class="letter" style="--delay: 0.00s;">K</span>
          <span class="letter" style="--delay: 0.08s;">i</span>
          <span class="letter" style="--delay: 0.16s;">r</span>
          <span class="letter" style="--delay: 0.24s;">o</span>
          <span class="letter" style="--delay: 0.32s;">k</span>
          <span class="letter" style="--delay: 0.40s;">u</span>
        </span>
        <span class="word-space"></span>
        <span class="word-note">
          <span class="letter" style="--delay: 0.48s;">N</span>
          <span class="letter" style="--delay: 0.56s;">o</span>
          <span class="letter" style="--delay: 0.64s;">t</span>
          <span class="letter" style="--delay: 0.72s;">e</span>
        </span>
      </div>
      <div class="status-badge" role="status">
        <div class="status-indicator"></div>
        <span class="status-text" id="status-text">Starting background engine...</span>
      </div>
    </div>
  </div>

  <!-- Fixed Top Chrome Window Header -->
  <div id="top-chrome-container"></div>

  <!-- Dynamic Tab View Container -->
  <main id="view-container" role="main"></main>

  <!-- Floating Tactile Bottom Navigation Dock -->
  <div id="bottom-dock-container"></div>
  <div id="mascot-host-stash" hidden></div>

  <!-- Vendored CSP-Safe Lottie SVG Player Runtime -->
  <script src="./ui/vendor/lottie.min.js"></script>
  <!-- Vendored Rive Canvas Runtime for local companion animations -->
  <script src="./ui/vendor/rive.js"></script>

  <!-- Application Bootstrap Script (Vanilla ES6 Modules) -->
  <script type="module">
    if (window.__KIROKU_PERF_DEBUG__) performance.mark('app:start');
    import { prefetchRiveAssets } from './ui/rive_mascot.js';
    import { scheduleMascotHostCreation } from './ui/shell/mascot_host.js';
    // Warm Rive runtime and companion asset bytes immediately at boot
    prefetchRiveAssets();

    import { TopChrome } from './ui/shell/top_chrome.js';
    import { BottomDock } from './ui/shell/bottom_dock.js';
    import { AppRouter } from './ui/router.js';

    function bootstrap() {
      let router = null;

      // 1. Initialize Floating Bottom Dock
      const bottomDock = new BottomDock({
        container: document.getElementById('bottom-dock-container'),
        onTabChange: (tabId) => {
          if (router) {
            router.navigateToTab(tabId, true);
          }
        }
      });
      bottomDock.init();

      // 2. Initialize App Router
      router = new AppRouter({
        viewContainer: document.getElementById('view-container'),
        bottomDock: bottomDock
      });
      window.router = router;

      // 3. Initialize Shared Top Chrome
      const topChrome = new TopChrome({
        container: document.getElementById('top-chrome-container'),
        onNavigate: (destination) => {
          if (router) {
            router.navigateToTab(destination, true);
          }
        }
      });
      topChrome.init();

      // 4. Start Router
      router.init();
      scheduleMascotHostCreation();

      // Seamlessly fade and dismiss loading splash now that the entire app is fully rendered and warmed
      const splash = document.getElementById('app-loading-splash');
      const dismissSplash = () => {
        if (splash && !splash.__dismissed) {
          splash.__dismissed = true;
          splash.classList.add('hidden-splash');
          setTimeout(() => {
            if (splash.parentNode) splash.parentNode.removeChild(splash);
          }, 320);
        }
      };

      if (window.desktopAPI?.onBackendReady) {
        window.desktopAPI.onBackendReady(() => dismissSplash());
      }
      setTimeout(dismissSplash, 600);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootstrap);
    } else {
      bootstrap();
    }
  </script>
</body>

</html>
