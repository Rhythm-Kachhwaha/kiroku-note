<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiroku Note — Sign In</title>
  <link rel="stylesheet" href="./ui/styles/tokens.css">
  <link rel="stylesheet" href="./ui/styles/fonts.css">
  <link rel="stylesheet" href="./ui/styles/tactile.css">
  <style>
    :root {
      --text-subtle: var(--paper-subtle, var(--text-muted));
    }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--pure-black);
      color: var(--warm-paper);
      font-family: var(--font-sans);
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      padding: 32px 28px;
      background: var(--ink-surface);
      border: 1.5px solid var(--tactile-stroke);
      border-radius: 12px;
      box-shadow: 4px 4px 0 var(--tactile-stroke);
      text-align: center;
      box-sizing: border-box;
    }
    .brand-title {
      font-family: var(--font-display, "Noto Sans JP", sans-serif);
      font-size: 24px;
      font-weight: 700;
      color: var(--warm-paper);
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .brand-sub {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 28px;
    }
    .auth-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      border: 1.5px solid var(--tactile-stroke);
      text-decoration: none;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--tactile-stroke);
      transition: transform var(--duration-fast, 160ms) var(--spring-snappy), box-shadow var(--duration-fast, 160ms);
      box-sizing: border-box;
    }
    .auth-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 var(--tactile-stroke);
    }
    .auth-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--tactile-stroke);
    }
    .auth-btn-google {
      background: var(--vermilion);
      color: var(--pure-white);
      border: 1.5px solid var(--tactile-stroke);
      box-shadow: 3px 3px 0 var(--tactile-stroke);
    }
    .auth-btn-google:hover {
      background: var(--vermilion-hover);
      color: var(--pure-white);
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 var(--tactile-stroke);
    }
    .auth-btn-google:active {
      background: var(--vermilion-active);
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--tactile-stroke);
    }
    .auth-btn-github {
      background: var(--warm-paper);
      color: var(--ink-black);
      border: 1.5px solid var(--tactile-stroke);
      box-shadow: 3px 3px 0 var(--tactile-stroke);
    }
    .auth-btn-github:hover {
      color: var(--ink-black);
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 var(--tactile-stroke);
    }
    .auth-btn-github:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--tactile-stroke);
    }
    .btn-icon {
      width: 18px;
      height: 18px;
      margin-right: 10px;
      fill: currentColor;
      flex-shrink: 0;
    }
    .footer-note,
    .dev-mode-hint {
      margin-top: 20px;
      font-size: 11px;
      color: var(--text-subtle);
      text-decoration: underline;
      display: inline-block;
      cursor: pointer;
    }
    .footer-note:hover,
    .dev-mode-hint:hover {
      color: var(--warm-paper);
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand-title">Kiroku Note</div>
    <div class="brand-sub">Local-First Japanese Mining &amp; Study System</div>

    <a href="/auth/google" class="auth-btn auth-btn-google">
      <svg class="btn-icon" viewBox="0 0 24 24">
        <path d="M12.24 10.285V13.4h6.887C18.2 16.14 15.645 18 12.24 18c-3.315 0-6-2.685-6-6s2.685-6 6-6c1.47 0 2.805.54 3.84 1.425l2.4-2.4C16.89 3.525 14.7 2.5 12.24 2.5 7.02 2.5 2.75 6.765 2.75 12s4.27 9.5 9.49 9.5c5.445 0 9.07-3.825 9.07-9.24 0-.675-.075-1.32-.195-1.975H12.24z"/>
      </svg>
      Sign in with Google
    </a>

    <a href="/auth/github" class="auth-btn auth-btn-github">
      <svg class="btn-icon" viewBox="0 0 24 24">
        <path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/>
      </svg>
      Sign in with GitHub
    </a>

    <a href="/" class="footer-note dev-mode-hint" style="display:inline-block; text-decoration:underline;">
      Continue as guest, data stays on this device. &rarr;
    </a>
  </main>
</body>
</html>
