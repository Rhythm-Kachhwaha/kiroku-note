<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiroku Note - Backend Connection Error</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121110;
      color: #ede8e1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 1.5rem;
      user-select: none;
    }
    .error-card {
      background: #181715;
      border: 1px solid #312b26;
      border-radius: 10px;
      padding: 1.5rem;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .brand-wordmark {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #ede8e1;
      margin-bottom: 1rem;
    }
    .error-icon {
      width: 36px;
      height: 36px;
      stroke: #cc4f4f;
      stroke-width: 2;
      fill: none;
      margin: 0 auto 1rem auto;
    }
    .error-title {
      font-size: 1rem;
      font-weight: 600;
      color: #ede8e1;
      margin-bottom: 0.5rem;
    }
    .error-msg {
      font-size: 0.82rem;
      color: #9e948a;
      line-height: 1.4;
      margin-bottom: 1.25rem;
    }
    .actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
    }
    .btn {
      padding: 0.5rem 1rem;
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-retry {
      background: #b84632;
      color: #ffffff;
    }
    .btn-retry:hover {
      background: #c8503a;
    }
    .btn-quit {
      background: #211e1b;
      border-color: #312b26;
      color: #9e948a;
    }
    .btn-quit:hover {
      background: #27231f;
      color: #ede8e1;
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="brand-wordmark">KIROKU</div>
    <svg class="error-icon" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
    <div class="error-title">Backend Connection Failed</div>
    <p class="error-msg" id="err-details">Could not start or connect to the local Kiroku backend on port 21828. Please check if another process is occupying the port or consult the log file.</p>
    <div class="actions">
      <button type="button" class="btn btn-retry" onclick="window.desktopAPI.retryBackend()">Retry</button>
      <button type="button" class="btn btn-quit" onclick="window.desktopAPI.quit()">Quit Kiroku</button>
    </div>
  </div>
</body>
</html>
