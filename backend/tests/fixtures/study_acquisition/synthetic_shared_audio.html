<p>**Reading passage 1**</p>
<figure class="wp-block-audio"><audio controls src="https://japanesetest4you.com/choukai/0008/n1_shared.mp3"></audio></figure>
<p>男の人と女の人が話しています。</p>

<p><strong>1. Question 1</strong><br>
男の人はこれから何をしますか。<br>
<input name="quest1" type="radio" value="1"> 書類を提出する<br>
<input name="quest1" type="radio" value="2"> 会議室を予約する<br>
<input name="quest1" type="radio" value="3"> 資料を印刷する<br>
<input name="quest1" type="radio" value="4"> 部長に連絡する
</p>

<p><strong>2. Question 2</strong><br>
女の人は何を手伝いますか。<br>
<input name="quest2" type="radio" value="1"> 書類の確認<br>
<input name="quest2" type="radio" value="2"> 部屋の掃除<br>
<input name="quest2" type="radio" value="3"> お茶の準備<br>
<input name="quest2" type="radio" value="4"> 参加者への案内
</p>

<p><strong>Answer Key:</strong></p>
<p>Question 1: 3 (資料を印刷する)<br>
Question 2: 1 (書類の確認)</p>
