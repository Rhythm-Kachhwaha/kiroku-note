<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kiroku Note - Authentication</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0E0D0C;
      color: #F0ECE3;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
    }
    .auth-card {
      background: #1A1917;
      border: 2px solid #32302C;
      box-shadow: 6px 6px 0 #000000;
      padding: 28px 32px;
      width: 360px;
      text-align: center;
      border-radius: 2px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 20px;
    }
    .brand-title {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .brand-badge {
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      color: #F0ECE3;
      background: #D94B38;
      border: 2px solid #000000;
      padding: 2px 6px;
      box-shadow: 2px 2px 0 #000000;
    }
    .status-message {
      font-size: 14px;
      font-weight: 700;
      color: #C9C3B8;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .status-spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid #32302C;
      border-top-color: #D94B38;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-detail {
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 11px;
      color: #8E8A81;
    }
    .status-error {
      color: #E55A47;
    }
    .status-success {
      color: #4EBB7B;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="brand">
      <span class="brand-title">Kiroku</span>
      <span class="brand-badge">Note</span>
    </div>
    <div id="spinner" class="status-spinner"></div>
    <div id="status-title" class="status-message">Completing Sign-In…</div>
    <div id="status-detail" class="status-detail">Exchanging authentication token with Kiroku Cloud.</div>
  </div>
  <script src="auth.js"></script>
</body>
</html>
