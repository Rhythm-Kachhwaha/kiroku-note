<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kiroku Note</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 296px;
      padding: 14px;
      background-color: #0E0D0C;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.026) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.026) 1px, transparent 1px);
      background-size: 20px 20px;
      color: #F0ECE3;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      user-select: none;
      -webkit-user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 2px solid #32302C;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #F0ECE3;
    }

    .brand-badge {
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 9.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #F0ECE3;
      background: #D94B38;
      border: 2px solid #000000;
      border-radius: 2px;
      padding: 2px 6px;
      box-shadow: 2px 2px 0 #000000;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      color: #C9C3B8;
      background: #1A1917;
      border: 2px solid #000000;
      padding: 2px 7px;
      box-shadow: 2px 2px 0 #000000;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 1px;
      background: #8E8A81;
    }

    .status-dot.online {
      background: #4EBB7B;
    }

    .section {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: #1A1917;
      border: 2px solid #32302C;
      border-radius: 2px;
      box-shadow: 4px 4px 0 #000000;
    }

    .toggle-label {
      font-size: 11.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #F0ECE3;
    }

    .toggle-switch {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #100F0E;
      border: 2px solid #46433D;
      border-radius: 2px;
      box-shadow: 2px 2px 0 #000000;
      transition: background-color 140ms ease, border-color 140ms ease;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 2px;
      top: 2px;
      background: #C9C3B8;
      border-radius: 1px;
      transition: transform 140ms cubic-bezier(0.34, 1.56, 0.64, 1), background-color 140ms ease;
    }

    input:checked + .slider {
      background: #4EBB7B;
      border-color: #000000;
    }

    input:checked + .slider:before {
      transform: translateX(18px);
      background: #0B0A09;
    }

    .stats-card {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 9px 8px;
      background: #1A1917;
      border: 2px solid #32302C;
      border-radius: 2px;
      box-shadow: 4px 4px 0 #000000;
      text-align: center;
    }

    .stat-val {
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 19px;
      font-weight: 900;
      color: #D94B38;
      line-height: 1.1;
    }

    .stat-label {
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 9.5px;
      font-weight: 800;
      color: #8E8A81;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .hotkey-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 9px 10px;
      background: #1A1917;
      border: 2px solid #32302C;
      border-radius: 2px;
      box-shadow: 4px 4px 0 #000000;
      font-size: 11px;
    }

    .hotkey-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #C9C3B8;
      font-weight: 600;
    }

    .kbd {
      padding: 2px 6px;
      background: #100F0E;
      border: 1.5px solid #32302C;
      border-radius: 2px;
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 10px;
      font-weight: 800;
      color: #F0ECE3;
      box-shadow: 2px 2px 0 #000000;
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 6px;
    }

    .tactile-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 10px;
      background: #242320;
      color: #F0ECE3;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border: 2px solid #000000;
      outline: 1px solid #32302C;
      outline-offset: -3px;
      border-radius: 2px;
      box-shadow: 4px 4px 0 #000000;
      cursor: pointer;
      transition: transform 140ms ease, box-shadow 140ms ease, background-color 140ms ease, border-color 140ms ease;
    }

    .tactile-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 #000000;
      background: #2E2C28;
      border-color: #D94B38;
      outline-color: transparent;
    }

    .tactile-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 #000000;
    }

    .tactile-btn.primary {
      background: #D94B38;
      color: #F0ECE3;
      border-color: #000000;
      outline-color: transparent;
      box-shadow: 4px 4px 0 #000000;
    }

    .tactile-btn.primary:hover {
      background: #E55A47;
      border-color: #000000;
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 #000000;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="brand-title">Kiroku</span>
      <span class="brand-badge">Note</span>
    </div>
    <div class="status-pill">
      <span id="backend-dot" class="status-dot"></span>
      <span id="backend-status">Checking…</span>
    </div>
  </div>

  <div class="section">
    <div class="toggle-row">
      <span class="toggle-label">Extension Mining</span>
      <label class="toggle-switch">
        <input type="checkbox" id="toggle-mining" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="toggle-label">Enable on This Site</span>
      <label class="toggle-switch">
        <input type="checkbox" id="toggle-site" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="section" id="account-section">
    <div class="toggle-row" style="flex-direction: column; align-items: stretch; gap: 8px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span class="toggle-label">Account</span>
        <span id="account-badge" class="brand-badge" style="background:#32302C; border:1.5px solid #000; font-size:9px; padding:2px 5px;">Guest</span>
      </div>
      <div id="account-actions-logged-out" style="display: flex; gap: 6px;">
        <button type="button" id="btn-popup-google-login" class="tactile-btn" style="flex: 1; padding: 6px 4px; font-size: 10px;">Google</button>
        <button type="button" id="btn-popup-guest-login" class="tactile-btn" style="flex: 1; padding: 6px 4px; font-size: 10px;">Guest</button>
      </div>
      <div id="account-actions-logged-in" style="display: none;">
        <button type="button" id="btn-popup-logout" class="tactile-btn" style="width: 100%; padding: 6px 4px; font-size: 10px;">Sign Out</button>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="stats-card">
      <div class="stat-item">
        <span id="stat-known" class="stat-val">-</span>
        <span class="stat-label">Known Words</span>
      </div>
      <div class="stat-item">
        <span id="stat-mined" class="stat-val">-</span>
        <span class="stat-label">Mined Cards</span>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="hotkey-list">
      <div class="hotkey-row">
        <span>Scan text</span>
        <span class="kbd">Shift + Hover</span>
      </div>
      <div class="hotkey-row">
        <span>Quick mine</span>
        <span class="kbd">Alt + M</span>
      </div>
      <div class="hotkey-row">
        <span>Screen OCR</span>
        <span class="kbd">Alt + O</span>
      </div>
      <div class="hotkey-row">
        <span>Subtitles prev / next</span>
        <span class="kbd">A / D</span>
      </div>
      <div class="hotkey-row">
        <span>Replay line</span>
        <span class="kbd">R</span>
      </div>
      <div class="hotkey-row">
        <span>Toggle blur</span>
        <span class="kbd">B</span>
      </div>
    </div>
  </div>

  <div class="btn-row">
    <button type="button" id="btn-sidepanel" class="tactile-btn">Side Panel</button>
    <button type="button" id="btn-app" class="tactile-btn primary">Open App</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
